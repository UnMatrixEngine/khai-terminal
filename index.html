<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KHAI Terminal</title>
  <style>:root {
  --bg: #ffffff;
  --ink: #0b0b0c;
  --ink-soft: #5c5a56;
  --gold: #b08a4a;
  --gold-line: #d9c39a;
  --line: #ece8e1;
  --pad: 22px;
  --tab-h: 58px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Times New Roman", Times, serif;
  height: 100%;
}
body { max-width: 480px; margin: 0 auto; min-height: 100dvh; }
#app { min-height: 100dvh; padding-bottom: calc(var(--tab-h) + 16px); }
.rail {
  position: fixed;
  left: max(8px, calc(50% - 240px + 8px));
  top: 72px;
  bottom: calc(var(--tab-h) + 16px);
  width: 2px;
  background: var(--line);
  z-index: 20;
  pointer-events: none;
}
.rail span {
  position: absolute; left: -1px; width: 4px; height: 42px;
  background: var(--gold); border-radius: 4px;
}
header.brand { text-align: center; padding: 22px 24px 4px; }
header.brand .logo {
  height: 28px; width: auto; max-width: 240px;
  display: block; margin: 0 auto;
  object-fit: contain;
}
header.brand .sub {
  margin-top: 8px;
  font-family: -apple-system, "IBM Plex Sans", sans-serif;
  font-size: 10px; letter-spacing: 0.42em;
  text-transform: uppercase; color: var(--gold);
}
.gate { display: flex; justify-content: center; gap: 8px; padding: 10px 22px 4px; }
.gate button {
  font-family: -apple-system, sans-serif;
  font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  border: 1px solid var(--line); background: #fff; color: var(--ink-soft);
  padding: 6px 12px; cursor: pointer;
}
.gate button.on { border-color: var(--gold); color: var(--ink); }
.wrap { padding: 8px var(--pad) 28px calc(var(--pad) + 10px); }
.kicker {
  font-family: -apple-system, sans-serif;
  font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 6px;
}
.muted { color: var(--ink-soft); font-family: -apple-system, sans-serif; font-size: 11px; }
.week-card { margin: 10px 0 20px; }
.week-meta { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
canvas.spark { width: 100%; display: block; }
canvas#weekChart { height: 120px; }
canvas#pairGrowth, canvas.growth { height: 110px; }
.metrics {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
  margin-top: 14px; border-top: 1px solid var(--gold-line); padding-top: 14px;
}
.metrics b { display: block; font-size: 22px; font-weight: 500; }
.metrics span {
  font-family: -apple-system, sans-serif; font-size: 10px;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold);
}
.metrics b.gold { color: var(--gold); }
.feature {
  border: 1px solid var(--gold-line);
  padding: 14px 14px 10px;
  margin: 8px 0 22px;
}
.feature .pair { font-size: 26px; letter-spacing: 0.04em; }
.invite {
  margin: 8px 0 20px;
  padding: 16px 0 4px;
  border-top: 1px solid var(--line);
}
.invite button, .lockcard button, .cta {
  font-family: -apple-system, sans-serif;
  font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  background: none; border: 1px solid var(--gold); color: var(--ink);
  padding: 10px 16px; cursor: pointer;
}
.cat { margin: 22px 0 8px; }
.cat h3 {
  font-family: -apple-system, sans-serif;
  font-size: 10px; letter-spacing: 0.32em; color: var(--gold);
  text-transform: uppercase; border-bottom: 1px solid var(--line);
  padding-bottom: 8px; margin-bottom: 4px;
}
.row {
  width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line);
  padding: 12px 0; display: grid; grid-template-columns: 1fr auto auto;
  gap: 10px; align-items: center; text-align: left; cursor: pointer;
  color: inherit; font: inherit;
}
.row:active { opacity: 0.62; }
.row .pair { font-size: 20px; letter-spacing: 0.04em; }
.row .side {
  font-family: -apple-system, sans-serif; font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); margin-top: 2px;
}
.row .side b { color: var(--gold); font-weight: 500; }
.row .st {
  font-family: -apple-system, sans-serif; font-size: 10px;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold);
}
.row .px { font-family: -apple-system, sans-serif; font-size: 11px; text-align: right; }
.row .px small { display: block; color: var(--ink-soft); }
.row .sealed { color: var(--gold-line); letter-spacing: 0.2em; }
.chart-head {
  padding: 12px var(--pad) 10px calc(var(--pad) + 10px);
  display: flex; justify-content: space-between; align-items: flex-end;
}
.chart-head h1 { font-size: 32px; font-weight: 500; letter-spacing: 0.06em; }
.chart-head .meta {
  font-family: -apple-system, sans-serif; font-size: 11px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); text-align: right;
}
#tv { height: 280px; margin: 0 12px 0 22px; border: 1px solid var(--line); background: #fff; }
.lockcard {
  margin: 12px var(--pad) 0 calc(var(--pad) + 10px);
  border: 1px solid var(--gold-line); padding: 22px 18px; text-align: center;
}
.lockcard h2 { font-size: 22px; font-weight: 500; letter-spacing: 0.08em; }
.lockcard p { margin: 8px 0 16px; font-family: -apple-system, sans-serif; font-size: 12px; color: var(--ink-soft); }
.levels {
  margin: 8px var(--pad) 0 calc(var(--pad) + 10px);
  font-family: -apple-system, sans-serif; font-size: 12px;
}
.levels li {
  list-style: none; display: flex; justify-content: space-between;
  padding: 9px 0; border-bottom: 1px solid var(--line);
}
.levels .lab { letter-spacing: 0.14em; text-transform: uppercase; font-size: 10px; color: var(--ink-soft); }
.levels .taken { color: var(--gold); }
.winbox { margin: 22px var(--pad) 10px calc(var(--pad) + 10px); }
.winbox .row2 { display: flex; justify-content: space-between; align-items: baseline; }
.winpct { font-size: 36px; color: var(--gold); font-weight: 500; }
canvas#winChart { width: 100%; height: 28px; display: block; margin-top: 8px; }
.past { margin: 8px var(--pad) 24px calc(var(--pad) + 10px); }
.past li {
  list-style: none; display: grid; grid-template-columns: 1fr auto auto;
  gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line);
  font-family: -apple-system, sans-serif; font-size: 12px;
}
.past .w { color: var(--gold); }
.past .l { color: var(--ink-soft); }
.back {
  font-family: -apple-system, sans-serif; font-size: 10px; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--gold); background: none; border: 0;
  cursor: pointer; padding: 16px var(--pad) 0 calc(var(--pad) + 10px);
}
nav.tabs {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 0;
  width: min(480px, 100%); height: var(--tab-h); background: #fff;
  border-top: 1px solid var(--gold-line); display: grid;
  grid-template-columns: repeat(4, 1fr); z-index: 30;
}
nav.tabs button {
  background: none; border: 0;
  font-family: -apple-system, sans-serif; font-size: 10px;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-soft); cursor: pointer;
}
nav.tabs button.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--gold); }
</style>
</head>
<body>
  <div class="rail" aria-hidden="true"><span></span></div>
  <main id="app"></main>
  <nav class="tabs">
    <button data-tab="home" class="on">Home</button>
    <button data-tab="desk">Chart</button>
    <button data-tab="book">Book</button>
    <button data-tab="list">List</button>
  </nav>

  const LOGO = window.KHAI_LOGO || "logo.jpg";

  const ACCESS = {
    vip: false,
    featuredId: (KHAI.LIVE.find((t) => t.featured) || KHAI.LIVE[0]).id
  };

  function isVip() { return ACCESS.vip; }
  function canTrade(id) { return isVip() || id === ACCESS.featuredId; }
  function featured() { return KHAI.LIVE.find((t) => t.id === ACCESS.featuredId) || KHAI.LIVE[0]; }

  function fmt(n) {
    return Number(n).toLocaleString("en-US", { maximumFractionDigits: 2 });
  }
  function winRate(pair) {
    const rows = KHAI.HISTORY[pair] || [];
    if (!rows.length) return 0;
    return Math.round((rows.filter((r) => r.result === "W").length / rows.length) * 100);
  }
  function growth(pair) {
    const rows = (KHAI.HISTORY[pair] || []).slice().reverse();
    let acc = 0;
    const s = [0];
    rows.forEach((r) => { acc += r.pnl; s.push(acc); });
    return s;
  }

  function mark() {
    return `<img class="logo" src="${LOGO}" alt="KHAI" />`;
  }
  function gateBar() {
    return `<div class="gate">
      <button data-mode="free" class="${isVip() ? "" : "on"}">Free desk</button>
      <button data-mode="vip" class="${isVip() ? "on" : ""}">VIP group</button>
    </div>`;
  }
  function bindGate() {
    app.querySelectorAll(".gate button").forEach((b) => {
      b.onclick = () => { ACCESS.vip = b.dataset.mode === "vip"; route(); };
    });
  }

  function setRail() {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const y = max > 0 ? window.scrollY / max : 0;
    const track = document.querySelector(".rail");
    if (!track) return;
    railThumb.style.top = y * (track.clientHeight - 42) + "px";
  }
  window.addEventListener("scroll", setRail, { passive: true });

  function drawLine(canvas, series, hDefault) {
    if (!canvas || !series.length) return;
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth;
    const h = canvas.clientHeight || hDefault || 110;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    const min = Math.min(...series, 0) - 2;
    const max = Math.max(...series) + 4;
    ctx.strokeStyle = "#ece8e1";
    ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
      const y = 8 + ((h - 24) * i) / 3;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    ctx.strokeStyle = "#b08a4a";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    series.forEach((v, i) => {
      const x = series.length === 1 ? w / 2 : (i / (series.length - 1)) * (w - 8) + 4;
      const y = h - 16 - ((v - min) / (max - min)) * (h - 28);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.stroke();
    const last = series[series.length - 1];
    const lastX = w - 4;
    const lastY = h - 16 - ((last - min) / (max - min)) * (h - 28);
    ctx.fillStyle = "#b08a4a";
    ctx.beginPath(); ctx.arc(lastX, lastY, 2.4, 0, Math.PI * 2); ctx.fill();
  }
  function drawWin(canvas, pct) {
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.strokeStyle = "#ece8e1"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();
    ctx.strokeStyle = "#b08a4a";
    ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo((w * pct) / 100, h / 2); ctx.stroke();
  }

  const BINANCE = { ETH: "ETHUSDT", BTC: "BTCUSDT", SOL: "SOLUSDT" };

  function loadLw() {
    return new Promise((resolve, reject) => {
      if (window.LightweightCharts) return resolve(window.LightweightCharts);
      const s = document.createElement("script");
      s.src = "https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js";
      s.onload = () => resolve(window.LightweightCharts);
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  async function mountSetupChart(t, showLevels) {
    const el = document.getElementById("tv");
    if (!el) return;
    el.innerHTML = "";
    const spot = BINANCE[t.pair];
    if (!spot) {
      mountTV(KHAI.SYMBOLS[t.pair] || "BINANCE:ETHUSDT");
      return;
    }
    function synth(px) {
      const now = Math.floor(Date.now() / 1000);
      const out = [];
      let c = px * 0.97;
      for (let i = 80; i >= 0; i--) {
        const o = c;
        const drift = (px - c) * 0.08 + (Math.sin(i / 9) * px * 0.004);
        c = o + drift;
        const h = Math.max(o, c) * 1.004;
        const l = Math.min(o, c) * 0.996;
        out.push({ time: now - i * 3600, open: o, high: h, low: l, close: c });
      }
      return out;
    }
    try {
      const lw = await loadLw();
      let candles = synth(t.last || t.entry);
      try {
        const res = await fetch("https://api.binance.com/api/v3/klines?symbol=" + spot + "&interval=1h&limit=120");
        if (res.ok) {
          const raw = await res.json();
          if (Array.isArray(raw) && raw.length) {
            candles = raw.map((k) => ({
              time: Math.floor(k[0] / 1000),
              open: +k[1], high: +k[2], low: +k[3], close: +k[4]
            }));
          }
        }
      } catch (net) {}
      const chart = lw.createChart(el, {
        width: el.clientWidth,
        height: el.clientHeight,
        layout: { background: { color: "#ffffff" }, textColor: "#5c5a56" },
        grid: { vertLines: { color: "#ece8e1" }, horzLines: { color: "#ece8e1" } },
        rightPriceScale: { borderColor: "#ece8e1" },
        timeScale: { borderColor: "#ece8e1" },
        crosshair: { vertLine: { color: "#d9c39a" }, horzLine: { color: "#d9c39a" } }
      });
      const series = chart.addCandlestickSeries({
        upColor: "#b08a4a", downColor: "#0b0b0c",
        borderUpColor: "#b08a4a", borderDownColor: "#0b0b0c",
        wickUpColor: "#b08a4a", wickDownColor: "#0b0b0c"
      });
      series.setData(candles);
      series.applyOptions({ lastValueVisible: true, priceLineVisible: false });
      if (showLevels) {
        const lines = [
          { price: t.entry, color: "#0b0b0c", title: "Entry", lineStyle: 0 },
          { price: t.sl, color: "#5c5a56", title: "Stop", lineStyle: 2 },
          { price: t.tps[0], color: "#b08a4a", title: "TP1", lineStyle: 0 },
          { price: t.tps[1], color: "#d9c39a", title: "TP2", lineStyle: 2 },
          { price: t.tps[2], color: "#d9c39a", title: "TP3", lineStyle: 2 }
        ];
        lines.forEach((ln) => series.createPriceLine({
          price: ln.price, color: ln.color, lineWidth: 1,
          lineStyle: ln.lineStyle, axisLabelVisible: true, title: ln.title
        }));
      }
      chart.timeScale().fitContent();
    } catch (e) {
      mountTV(KHAI.SYMBOLS[t.pair] || "BINANCE:ETHUSDT");
    }
  }

  function mountTV(symbol) {
    const el = document.getElementById("tv");
    if (!el) return;
    el.innerHTML = "";
    const inner = document.createElement("div");
    inner.className = "tradingview-widget-container";
    inner.style.cssText = "height:100%;width:100%";
    const widget = document.createElement("div");
    widget.className = "tradingview-widget-container__widget";
    widget.style.cssText = "height:100%;width:100%";
    const script = document.createElement("script");
    script.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
    script.async = true;
    script.innerHTML = JSON.stringify({
      autosize: true, symbol, interval: "60", timezone: "Etc/UTC",
      theme: "light", style: "1", locale: "en", backgroundColor: "#ffffff",
      hide_top_toolbar: true, hide_legend: true, allow_symbol_change: false,
      calendar: false, hide_volume: true, support_host: "https://www.tradingview.com"
    });
    inner.appendChild(widget); inner.appendChild(script); el.appendChild(inner);
  }

  function liveByCat() {
    const map = { CRYPTO: [], METAL: [], INDICES: [], MORE: [] };
    KHAI.LIVE.forEach((t) => (map[t.cat] || map.MORE).push(t));
    return map;
  }

  function rowHtml(t, opts) {
    const open = canTrade(t.id);
    const wr = winRate(t.pair);
    if (!open) {
      return `<button class="row locked" data-id="${t.id}">
        <div>
          <div class="pair">${t.pair}</div>
          <div class="side">${t.cat} · book ${wr}%</div>
        </div>
        <div class="st">Locked</div>
        <div class="px sealed">Live</div>
      </button>`;
    }
    return `<button class="row" data-id="${t.id}">
      <div>
        <div class="pair">${t.pair}</div>
        <div class="side">${t.side} <b>${t.lev}×</b></div>
      </div>
      <div class="st">${t.featured && !isVip() ? "Today" : "Live"}</div>
      <div class="px">${fmt(t.entry)}<small>→ ${fmt(t.last)}</small></div>
    </button>`;
  }
  function bindRows() {
    app.querySelectorAll(".row").forEach((b) =>
      b.addEventListener("click", () => openChart(b.dataset.id))
    );
  }

  function renderHome() {
    const grouped = liveByCat();
    const f = featured();
    const sealed = KHAI.LIVE.filter((t) => !canTrade(t.id)).length;
    app.innerHTML = `
      <header class="brand">${mark()}<div class="sub">${isVip() ? "vip terminal" : "terminal"}</div></header>
      ${gateBar()}
      <div class="wrap">
        <div class="week-card">
          <div class="week-meta">
            <div><div class="kicker">Week</div><div class="muted">${KHAI.WEEK.label}</div></div>
            <div class="muted">blended +${KHAI.WEEK.blended}%</div>
          </div>
          <canvas id="weekChart" class="spark"></canvas>
          <div class="metrics">
            <div><span>Taken</span><b>${KHAI.WEEK.taken}</b></div>
            <div><span>Full TP</span><b>${KHAI.WEEK.fullTp}</b></div>
            <div><span>Win rate</span><b class="gold">${Math.round((KHAI.WEEK.fullTp / KHAI.WEEK.taken) * 100)}%</b></div>
          </div>
        </div>

        <div class="kicker">Desk call</div>
        <button class="feature row" data-id="${f.id}" style="display:block;border:1px solid var(--gold-line);padding:14px;margin-bottom:8px">
          <div class="pair">${f.pair}</div>
          <div class="side">${f.side} <b>${f.lev}×</b> · today's free call</div>
          <div class="muted" style="margin-top:8px">${fmt(f.entry)} → ${fmt(f.last)} · pair book ${winRate(f.pair)}%</div>
        </button>

        ${!isVip() ? `<div class="invite">
          <div class="kicker">VIP desk</div>
          <p class="muted" style="margin:6px 0 12px">${sealed} more live calls on the paid book. Chart and history stay open on every pair.</p>
          <button class="cta" id="goVip">Open the full book</button>
        </div>` : `<p class="muted" style="margin-bottom:12px">Full book from the VIP group.</p>`}

        <div class="kicker">Live</div>
        ${CATS.map((c) => {
          const rows = grouped[c] || [];
          if (!rows.length && c === "MORE") {
            return `<section class="cat"><h3>${c}</h3><p class="muted">Further markets when they run.</p></section>`;
          }
          if (!rows.length) return "";
          return `<section class="cat"><h3>${c}</h3>${rows.map((t) => rowHtml(t)).join("")}</section>`;
        }).join("")}
      </div>`;
    bindGate();
    bindRows();
    const gv = document.getElementById("goVip");
    if (gv) gv.onclick = () => { ACCESS.vip = true; route(); };
    requestAnimationFrame(() => { drawLine(document.getElementById("weekChart"), KHAI.WEEK.series, 120); setRail(); });
    markTab("home");
  }

  function renderChart(id) {
    const t = KHAI.LIVE.find((x) => x.id === id) || featured();
    const open = canTrade(t.id);
    const hist = KHAI.HISTORY[t.pair] || [];
    const wr = winRate(t.pair);
    const g = growth(t.pair);
    const symbol = KHAI.SYMBOLS[t.pair] || "BINANCE:ETHUSDT";
    const labels = ["Entry", "Stop", "TP1", "TP2", "TP3"];
    const vals = [t.entry, t.sl, ...t.tps];
    const lastAcc = g[g.length - 1] || 0;

    let levels = "";
    if (open) {
      levels = `<ul class="levels">${vals.map((v, i) => {
        const taken = i >= 2 && t.taken.includes(i - 1);
        return `<li><span class="lab">${labels[i]}</span><span class="${taken ? "taken" : ""}">${fmt(v)}${taken ? "  ·  taken" : ""}</span></li>`;
      }).join("")}</ul>`;
    } else {
      levels = `<div class="lockcard">
        <div class="kicker">Live levels</div>
        <h2>VIP group</h2>
        <p>Chart and the pair book stay public. Today's entry, stop and targets sit on the paid desk.</p>
        <button id="unlock">Unlock · KHAI</button>
      </div>`;
    }

    app.innerHTML = `
      <button class="back" id="back">← Home</button>
      ${gateBar()}
      <div class="chart-head">
        <h1>${t.pair}</h1>
        <div class="meta">${open ? t.side + " " + t.lev + "×<br>" + (t.featured && !isVip() ? "today" : "live") : "book · sealed live"}</div>
      </div>
      <div id="tv"></div>
      ${levels}
      <div class="winbox">
        <div class="row2">
          <div>
            <div class="kicker">Pair growth</div>
            <div class="muted">${hist.length} closed · cumulative ${lastAcc > 0 ? "+" : ""}${lastAcc.toFixed(1)}%</div>
          </div>
          <div class="winpct">${wr}%</div>
        </div>
        <canvas id="pairGrowth" class="spark growth"></canvas>
        <canvas id="winChart"></canvas>
      </div>
      <div class="kicker" style="margin-left:calc(var(--pad) + 10px)">Past results</div>
      <ul class="past">
        ${hist.map((h) =>
          `<li><span>${h.when} · ${h.side}</span><span class="${h.result === "W" ? "w" : "l"}">${h.result}</span><span>${h.pnl > 0 ? "+" : ""}${h.pnl}%</span></li>`
        ).join("")}
      </ul>`;
    document.getElementById("back").onclick = () => { location.hash = "#/"; renderHome(); };
    const un = document.getElementById("unlock");
    if (un) un.onclick = () => { ACCESS.vip = true; renderChart(t.id); };
    bindGate();
    requestAnimationFrame(() => {
      drawLine(document.getElementById("pairGrowth"), g, 110);
      drawWin(document.getElementById("winChart"), wr);
      mountSetupChart(t, open);
      setRail();
    });
    markTab("desk");
  }

  function renderBook() {
    app.innerHTML = `
      <header class="brand">${mark()}<div class="sub">running · closed</div></header>
      ${gateBar()}
      <div class="wrap">
        <div class="kicker">Running</div>
        ${KHAI.LIVE.map((t) => rowHtml(t)).join("")}
        <div class="kicker" style="margin-top:28px">Closed</div>
        <p class="muted" style="margin-bottom:8px">Public ledger. Proof first.</p>
        <ul class="past">${KHAI.CLOSED.map((c) =>
          `<li><span>${c.pair} · ${c.side}</span><span class="${c.pnl >= 0 ? "w" : "l"}">${c.when}</span><span>${c.pnl > 0 ? "+" : ""}${c.pnl}%</span></li>`
        ).join("")}</ul>
      </div>`;
    bindGate(); bindRows(); markTab("book"); setRail();
  }

  function renderList() {
    app.innerHTML = `
      <header class="brand">${mark()}<div class="sub">shortlist</div></header>
      ${gateBar()}
      <div class="wrap">
        ${KHAI.LIVE.map((t) => {
          const wr = winRate(t.pair);
          return `<button class="row" data-id="${t.id}">
            <div><div class="pair">${t.pair}</div><div class="side">${t.cat}</div></div>
            <div class="st">${wr}%</div>
            <div class="px">${canTrade(t.id) ? fmt(t.last) : "book"}</div>
          </button>`;
        }).join("")}
      </div>`;
    bindGate(); bindRows(); markTab("list"); setRail();
  }

  function openChart(id) {
    location.hash = "#/chart/" + id;
    window.scrollTo(0, 0);
    renderChart(id);
  }
  function markTab(name) {
    tabs.forEach((t) => t.classList.toggle("on", t.dataset.tab === name));
  }
  function route() {
    const h = location.hash || "#/";
    if (h.startsWith("#/chart/")) renderChart(h.split("/")[2]);
    else if (h === "#/book") renderBook();
    else if (h === "#/list") renderList();
    else if (h === "#/desk") renderChart(featured().id);
    else renderHome();
  }

  tabs.forEach((t) => t.addEventListener("click", () => {
    const map = { home: "#/", desk: "#/desk", book: "#/book", list: "#/list" };
    location.hash = map[t.dataset.tab];
    window.scrollTo(0, 0);
    route();
  }));
  window.addEventListener("hashchange", route);

  try {
    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
      if (Telegram.WebApp.setHeaderColor) Telegram.WebApp.setHeaderColor("#ffffff");
      if (Telegram.WebApp.setBackgroundColor) Telegram.WebApp.setBackgroundColor("#ffffff");
    }
  } catch (e) {}

  try { route(); } catch (e) {
    app.innerHTML = "<div class=wrap><p class=muted>Desk failed to mount.</p></div>";
  }
})();

  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</body>
</html>
